<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Client Acquisition Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .kanban-column { min-height: 400px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600">Acquire Clients</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                    <a href="/leads" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Leads</a>
                    <a href="/kanban" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Kanban</a>
                    <a href="/hot-leads" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Hot Leads</a>
                    <a href="/drafts" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Drafts</a>
                    <a href="/settings" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Settings</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Discovery Alerts Toast Container -->
    {% if alerts %}
    <div class="fixed bottom-4 right-4 z-50 space-y-3 max-w-sm">
        {% for alert in alerts %}
        <div class="bg-orange-50 border-l-4 border-orange-500 rounded-lg shadow-lg p-4 flex items-start justify-between">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-orange-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-orange-800">{{ alert.message }}</p>
                    <p class="text-xs text-orange-600 mt-1">{{ alert.city }} • {{ alert.category }}</p>
                </div>
            </div>
            <form action="/alerts/{{ alert.id }}/dismiss" method="post" class="ml-4 flex-shrink-0">
                <button type="submit" class="text-orange-400 hover:text-orange-600 focus:outline-none">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </form>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
